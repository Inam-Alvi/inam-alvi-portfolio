<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Periodic Table | Inam Alvi</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161920;
            --border-color: #242936;
            --text-white: #ffffff;
            --text-secondary: #94a3b8;
            --heading-yellow: #ffd000;
            --subheading-blue: #00aeef;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-white: #0f172a;
            --text-secondary: #475569;
            --heading-yellow: #d97706;
            --subheading-blue: #0284c7;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-white);
            min-height: 100vh;
            padding: 16px;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .header-left h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--heading-yellow);
        }

        .header-left p {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .header-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-white);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            border-color: var(--subheading-blue);
            color: var(--subheading-blue);
        }

        .filter-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 4px 12px;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.65rem;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            border-color: var(--heading-yellow);
            color: var(--heading-yellow);
        }

        .filter-btn.active {
            border-color: var(--heading-yellow);
            color: var(--heading-yellow);
            background: rgba(255, 208, 0, 0.08);
        }

        .heatmap-toggle {
            padding: 4px 12px;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.65rem;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .heatmap-toggle:hover {
            border-color: var(--subheading-blue);
            color: var(--subheading-blue);
        }

        .heatmap-toggle.active {
            border-color: var(--heading-yellow);
            color: var(--heading-yellow);
            background: rgba(255, 208, 0, 0.08);
        }

        /* Temperature Slider */
        .temp-control {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .temp-control label {
            font-size: 0.65rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .temp-control input[type="range"] {
            width: 80px;
            accent-color: var(--heading-yellow);
            cursor: pointer;
            height: 3px;
            border-radius: 2px;
            background: var(--border-color);
            -webkit-appearance: none;
        }

        .temp-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--heading-yellow);
            cursor: pointer;
        }

        .temp-control .temp-value {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--heading-yellow);
            min-width: 40px;
        }

        /* Main Layout */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }

        .table-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        .table-wrapper::-webkit-scrollbar {
            height: 6px;
        }
        .table-wrapper::-webkit-scrollbar-track {
            background: var(--border-color);
            border-radius: 3px;
        }
        .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--heading-yellow);
            border-radius: 3px;
        }

        /* Periodic Table Grid */
        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 3px;
            min-width: 800px;
        }

        .element-cell {
            aspect-ratio: 1 / 1.1;
            border-radius: 6px;
            padding: 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            position: relative;
            min-height: 55px;
            background: rgba(255, 255, 255, 0.05);
        }

        .element-cell:hover {
            transform: scale(1.08);
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border-color: var(--heading-yellow);
        }

        .element-cell.dim {
            opacity: 0.2;
            transform: scale(0.95);
        }

        .element-cell .symbol {
            font-size: 0.85rem;
            font-weight: 700;
            line-height: 1;
            color: var(--text-white);
        }

        .element-cell .number {
            font-size: 0.5rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1;
        }

        .element-cell .mass {
            font-size: 0.45rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1;
        }

        .element-cell .state-indicator {
            position: absolute;
            top: 2px;
            right: 3px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        /* Category Colors */
        .cat-alkali { background: #ff2a6d; }
        .cat-alkaline { background: #ff6b35; }
        .cat-transition { background: #ffd000; color: #000; }
        .cat-transition .symbol { color: #000; }
        .cat-transition .number { color: rgba(0,0,0,0.5); }
        .cat-transition .mass { color: rgba(0,0,0,0.4); }
        .cat-metalloid { background: #10b981; }
        .cat-nonmetal { background: #00aeef; }
        .cat-halogen { background: #a855f7; }
        .cat-noble { background: #ec4899; }
        .cat-lanthanide { background: #f97316; }
        .cat-actinide { background: #ef4444; }
        .cat-post-transition { background: #8b5cf6; }
        .cat-unknown { background: #475569; }

        /* Lanthanide/Actinide rows */
        .lanthanide-row, .actinide-row {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            gap: 3px;
            margin-top: 4px;
        }

        .row-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.55rem;
            font-weight: 600;
            color: var(--text-secondary);
            padding-right: 6px;
            min-width: 30px;
        }

        .lanthanide-container, .actinide-container {
            display: grid;
            grid-template-columns: 30px 1fr;
            gap: 3px;
            margin-top: 4px;
            align-items: start;
        }

        .section-label {
            font-size: 0.6rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 2px;
        }

        /* Info Panel */
        .info-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
            position: sticky;
            top: 16px;
        }

        .info-panel::-webkit-scrollbar {
            width: 4px;
        }
        .info-panel::-webkit-scrollbar-track {
            background: var(--border-color);
            border-radius: 2px;
        }
        .info-panel::-webkit-scrollbar-thumb {
            background: var(--heading-yellow);
            border-radius: 2px;
        }

        .info-panel .placeholder {
            color: var(--text-secondary);
            text-align: center;
            padding: 30px 10px;
            font-size: 0.85rem;
        }

        .info-panel .placeholder .icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .element-header {
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .element-header .big-symbol {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1;
            min-width: 60px;
            text-align: center;
        }

        .element-header .big-name {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .element-header .big-number {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .element-header .big-mass {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
            font-size: 0.78rem;
        }

        .info-grid .item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-grid .item .label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .info-grid .item .value {
            color: var(--text-white);
            font-weight: 600;
            text-align: right;
        }

        .info-grid .item .value.highlight {
            color: var(--heading-yellow);
        }

        .info-description {
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.5;
            padding: 8px 0;
            border-top: 1px solid var(--border-color);
            margin-top: 4px;
        }

        .info-description strong {
            color: var(--text-white);
        }

        /* Heatmap overlay */
        .element-cell.heatmap {
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .info-panel {
                max-height: 400px;
                position: static;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-controls {
                justify-content: center;
            }
        }

        @media (max-width: 600px) {
            body { padding: 8px; }
            .header { padding: 10px; }
            .header-left h1 { font-size: 1.2rem; }
            .element-cell { min-height: 40px; padding: 2px; }
            .element-cell .symbol { font-size: 0.65rem; }
            .element-cell .number { font-size: 0.4rem; }
            .element-cell .mass { display: none; }
            .periodic-table { gap: 2px; min-width: 600px; }
            .lanthanide-row, .actinide-row { gap: 2px; }
            .info-panel { padding: 14px; }
            .element-header .big-symbol { font-size: 2rem; min-width: 40px; }
            .info-grid { grid-template-columns: 1fr; }
            .temp-control input[type="range"] { width: 60px; }
        }

        @media (max-width: 400px) {
            .periodic-table { min-width: 480px; }
            .element-cell .symbol { font-size: 0.5rem; }
            .element-cell .number { font-size: 0.35rem; }
            .element-cell .state-indicator { width: 4px; height: 4px; }
        }

        /* Footer */
        footer {
            margin-top: 16px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            padding: 8px 0;
        }

        .signature {
            font-family: 'Great Vibes', cursive;
            font-size: 1.6rem;
            color: var(--subheading-blue);
            font-weight: 400;
        }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
    </style>
</head>

</div>

        { number: 114, symbol: "Fl", name: "Flerovium", mass: 289.000, category: "unknown", electronConfig: "[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p²", electronegativity: null, state: "solid", meltingPoint: null, boilingPoint: null, description: "A synthetic radioactive element." },
        { number: 115, symbol: "Mc", name: "Moscovium", mass: 290.000, category: "unknown", electronConfig: "[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p³", electronegativity: null, state: "solid", meltingPoint: null, boilingPoint: null, description: "A synthetic radioactive element." },
        { number: 116, symbol: "Lv", name: "Livermorium", mass: 293.000, category: "unknown", electronConfig: "[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p⁴", electronegativity: null, state: "solid", meltingPoint: null, boilingPoint: null, description: "A synthetic radioactive element." },
        { number: 117, symbol: "Ts", name: "Tennessine", mass: 294.000, category: "unknown", electronConfig: "[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p⁵", electronegativity: null, state: "solid", meltingPoint: null, boilingPoint: null, description: "A synthetic radioactive element." },
        { number: 118, symbol: "Og", name: "Oganesson", mass: 294.000, category: "unknown", electronConfig: "[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p⁶", electronegativity: null, state: "gas", meltingPoint: null, boilingPoint: null, description: "The heaviest element. A synthetic radioactive noble gas." }
    ];

    // Category mapping
    const CATEGORY_COLORS = {
        'alkali': 'cat-alkali',
        'alkaline': 'cat-alkaline',
        'transition': 'cat-transition',
        'post-transition': 'cat-post-transition',
        'metalloid': 'cat-metalloid',
        'nonmetal': 'cat-nonmetal',
        'halogen': 'cat-halogen',
        'noble': 'cat-noble',
        'lanthanide': 'cat-lanthanide',
        'actinide': 'cat-actinide',
        'unknown': 'cat-unknown'
    };

    const CATEGORY_NAMES = {
        'alkali': 'Alkali Metals',
        'alkaline': 'Alkaline Earth Metals',
        'transition': 'Transition Metals',
        'post-transition': 'Post-Transition Metals',
        'metalloid': 'Metalloids',
        'nonmetal': 'Nonmetals',
        'halogen': 'Halogens',
        'noble': 'Noble Gases',
        'lanthanide': 'Lanthanides',
        'actinide': 'Actinides',
        'unknown': 'Unknown'
    };

    // Periodic table layout (row, column for each element number)
    const PERIODIC_LAYOUT = {
        1: [1, 1], 2: [1, 18],
        3: [2, 1], 4: [2, 2], 5: [2, 13], 6: [2, 14], 7: [2, 15], 8: [2, 16], 9: [2, 17], 10: [2, 18],
        11: [3, 1], 12: [3, 2], 13: [3, 13], 14: [3, 14], 15: [3, 15], 16: [3, 16], 17: [3, 17], 18: [3, 18],
        19: [4, 1], 20: [4, 2], 21: [4, 3], 22: [4, 4], 23: [4, 5], 24: [4, 6], 25: [4, 7], 26: [4, 8],
        27: [4, 9], 28: [4, 10], 29: [4, 11], 30: [4, 12], 31: [4, 13], 32: [4, 14], 33: [4, 15], 34: [4, 16],
        35: [4, 17], 36: [4, 18],
        37: [5, 1], 38: [5, 2], 39: [5, 3], 40: [5, 4], 41: [5, 5], 42: [5, 6], 43: [5, 7], 44: [5, 8],
        45: [5, 9], 46: [5, 10], 47: [5, 11], 48: [5, 12], 49: [5, 13], 50: [5, 14], 51: [5, 15], 52: [5, 16],
        53: [5, 17], 54: [5, 18],
        55: [6, 1], 56: [6, 2], 57: [6, 3], 72: [6, 4], 73: [6, 5], 74: [6, 6], 75: [6, 7], 76: [6, 8],
        77: [6, 9], 78: [6, 10], 79: [6, 11], 80: [6, 12], 81: [6, 13], 82: [6, 14], 83: [6, 15], 84: [6, 16],
        85: [6, 17], 86: [6, 18],
        87: [7, 1], 88: [7, 2], 89: [7, 3], 104: [7, 4], 105: [7, 5], 106: [7, 6], 107: [7, 7], 108: [7, 8],
        109: [7, 9], 110: [7, 10], 111: [7, 11], 112: [7, 12], 113: [7, 13], 114: [7, 14], 115: [7, 15],
        116: [7, 16], 117: [7, 17], 118: [7, 18]
    };

    // Lanthanides (57-71) and Actinides (89-103)
    const LANTHANIDES = [57, 58, 59, 60, 61, 62, 63, 64, 65, 66, 67, 68, 69, 70, 71];
    const ACTINIDES = [89, 90, 91, 92, 93, 94, 95, 96, 97, 98, 99, 100, 101, 102, 103];

    // ================================================================
    // STATE
    // ================================================================
    let currentFilter = 'all';
    let heatmapMode = 'none';
    let temperature = 298;
    let selectedElement = null;

    // ================================================================
    // BUILD PERIODIC TABLE
    // ================================================================
    function buildPeriodicTable() {
        const container = document.getElementById('periodicTableContainer');
        let html = '';

        // Main grid
        html += '<div class="periodic-table">';

        // Create 18 columns × 7 rows
        for (let row = 1; row <= 7; row++) {
            for (let col = 1; col <= 18; col++) {
                // Find element at this position
                let element = null;
                for (const e of ELEMENTS) {
                    const pos = PERIODIC_LAYOUT[e.number];
                    if (pos && pos[0] === row && pos[1] === col) {
                        element = e;
                        break;
                    }
                }

                if (element) {
                    const catClass = CATEGORY_COLORS[element.category] || 'cat-unknown';
                    const stateColor = getStateColor(element, temperature);
                    html += `
                        <div class="element-cell ${catClass}" 
                             data-number="${element.number}"
                             data-symbol="${element.symbol}"
                             data-category="${element.category}"
                             onclick="selectElement(${element.number})"
                             title="${element.name} (${element.symbol})">
                            <span class="number">${element.number}</span>
                            <span class="symbol">${element.symbol}</span>
                            <span class="mass">${element.mass}</span>
                            <span class="state-indicator" style="background:${stateColor};"></span>
                        </div>
                    `;
                } else {
                    // Empty cell
                    html += `<div class="element-cell" style="background:transparent;border-color:transparent;cursor:default;box-shadow:none;"></div>`;
                }
            }
        }

        html += '</div>';

        // Lanthanides
        html += '<div class="lanthanide-container">';
        html += '<div class="row-label">La-Lu</div>';
        html += '<div class="lanthanide-row">';
        for (const num of LANTHANIDES) {
            const el = ELEMENTS.find(e => e.number === num);
            if (el) {
                const catClass = CATEGORY_COLORS[el.category] || 'cat-unknown';
                const stateColor = getStateColor(el, temperature);
                html += `
                    <div class="element-cell ${catClass}" 
                         data-number="${el.number}"
                         data-symbol="${el.symbol}"
                         data-category="${el.category}"
                         onclick="selectElement(${el.number})"
                         title="${el.name} (${el.symbol})">
                        <span class="number">${el.number}</span>
                        <span class="symbol">${el.symbol}</span>
                        <span class="mass">${el.mass}</span>
                        <span class="state-indicator" style="background:${stateColor};"></span>
                    </div>
                `;
            }
        }
        html += '</div></div>';

        // Actinides
        html += '<div class="actinide-container">';
        html += '<div class="row-label">Ac-Lr</div>';
        html += '<div class="actinide-row">';
        for (const num of ACTINIDES) {
            const el = ELEMENTS.find(e => e.number === num);
            if (el) {
                const catClass = CATEGORY_COLORS[el.category] || 'cat-unknown';
                const stateColor = getStateColor(el, temperature);
                html += `
                    <div class="element-cell ${catClass}" 
                         data-number="${el.number}"
                         data-symbol="${el.symbol}"
                         data-category="${el.category}"
                         onclick="selectElement(${el.number})"
                         title="${el.name} (${el.symbol})">
                        <span class="number">${el.number}</span>
                        <span class="symbol">${el.symbol}</span>
                        <span class="mass">${el.mass}</span>
                        <span class="state-indicator" style="background:${stateColor};"></span>
                    </div>
                `;
            }
        }
        html += '</div></div>';

        container.innerHTML = html;
        applyFilter();
        applyHeatmap();
    }

    // ================================================================
    // STATE COLOR
    // ================================================================
    function getStateColor(element, temp) {
        const mp = element.meltingPoint;
        const bp = element.boilingPoint;

        if (!mp || !bp) return '#888888';

        if (temp < mp) return '#4fc3f7'; // solid - blue
        if (temp >= mp && temp < bp) return '#ffd54f'; // liquid - yellow
        return '#ef5350'; // gas - red
    }

    // ================================================================
    // FILTERS
    // ================================================================
    function applyFilter() {
        const cells = document.querySelectorAll('.element-cell');
        const filter = currentFilter;

        cells.forEach(cell => {
            const category = cell.dataset.category;
            if (filter === 'all' || category === filter) {
                cell.classList.remove('dim');
            } else {
                cell.classList.add('dim');
            }
        });

        // Update filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.filter === filter);
        });
    }

    // ================================================================
    // HEATMAP
    // ================================================================
    function applyHeatmap() {
        const cells = document.querySelectorAll('.element-cell');
        const mode = heatmapMode;

        if (mode === 'none') {
            cells.forEach(cell => {
                cell.style.background = '';
                cell.classList.remove('heatmap');
            });
            return;
        }

        // Find min/max values
        let values = [];
        for (const cell of cells) {
            const num = parseInt(cell.dataset.number);
            const el = ELEMENTS.find(e => e.number === num);
            if (el) {
                let val = null;
                if (mode === 'electronegativity') val = el.electronegativity;
                else if (mode === 'atomicRadius') val = el.atomicRadius || 0;
                else if (mode === 'meltingPoint') val = el.meltingPoint || 0;
                if (val !== null && val !== undefined && !isNaN(val)) {
                    values.push({ cell, val, el });
                }
            }
        }

        if (values.length === 0) return;

        const maxVal = Math.max(...values.map(v => v.val));
        const minVal = Math.min(...values.map(v => v.val));
        const range = maxVal - minVal || 1;

        values.forEach(({ cell, val }) => {
            const norm = (val - minVal) / range;
            // Blue (cold) to Yellow (hot)
            const r = Math.round(255 * norm);
            const g = Math.round(255 * (1 - Math.abs(norm - 0.5) * 2));
            const b = Math.round(255 * (1 - norm));
            const bg = `rgba(${r}, ${g}, ${b}, 0.25)`;
            cell.style.background = bg;
            cell.classList.add('heatmap');
            // Reset any category color overlay
        });
    }

    // ================================================================
    // SELECT ELEMENT
    // ================================================================
    function selectElement(number) {
        const el = ELEMENTS.find(e => e.number === number);
        if (!el) return;

        selectedElement = el;
        updateInfoPanel(el);

        // Highlight selected cell
        document.querySelectorAll('.element-cell').forEach(cell => {
            cell.style.borderColor = 'transparent';
            if (parseInt(cell.dataset.number) === number) {
                cell.style.borderColor = 'var(--heading-yellow)';
                cell.style.boxShadow = '0 0 20px rgba(255,208,0,0.3)';
            } else {
                cell.style.boxShadow = '';
            }
        });
    }

    // ================================================================
    // UPDATE INFO PANEL
    // ================================================================
    function updateInfoPanel(el) {
        const panel = document.getElementById('infoPanel');
        const catName = CATEGORY_NAMES[el.category] || el.category;

        const stateNames = { solid: 'Solid', liquid: 'Liquid', gas: 'Gas' };
        const state = stateNames[el.state] || el.state;

        const html = `
            <div class="element-header" style="border-color:${CATEGORY_COLORS[el.category] || '#475569'};">
                <div class="big-symbol" style="color:var(--heading-yellow);">${el.symbol}</div>
                <div>
                    <div class="big-name">${el.name}</div>
                    <div class="big-number">Atomic #${el.number} · ${catName}</div>
                    <div class="big-mass">Mass: ${el.mass} u</div>
                </div>
            </div>
            <div class="info-grid">
                <div class="item"><span class="label">Electron Config</span><span class="value highlight">${el.electronConfig}</span></div>
                <div class="item"><span class="label">State (298 K)</span><span class="value">${state}</span></div>
                <div class="item"><span class="label">Electronegativity</span><span class="value">${el.electronegativity || '—'}</span></div>
                <div class="item"><span class="label">Melting Point</span><span class="value">${el.meltingPoint ? el.meltingPoint + ' K' : '—'}</span></div>
                <div class="item"><span class="label">Boiling Point</span><span class="value">${el.boilingPoint ? el.boilingPoint + ' K' : '—'}</span></div>
                <div class="item"><span class="label">Category</span><span class="value">${catName}</span></div>
            </div>
            <div class="info-description">
                <strong>ℹ️</strong> ${el.description}
            </div>
        `;

        panel.innerHTML = html;
    }

    // ================================================================
    // TEMPERATURE UPDATE
    // ================================================================
    function updateTemperature(temp) {
        temperature = temp;
        document.getElementById('tempDisplay').textContent = Math.round(temp) + ' K';

        // Update state indicators
        document.querySelectorAll('.element-cell').forEach(cell => {
            const num = parseInt(cell.dataset.number);
            const el = ELEMENTS.find(e => e.number === num);
            if (el) {
                const color = getStateColor(el, temp);
                const indicator = cell.querySelector('.state-indicator');
                if (indicator) indicator.style.background = color;
            }
        });
    }

    // ================================================================
    // THEME TOGGLE
    // ================================================================
    document.getElementById('themeToggleBtn').addEventListener('click', function() {
        const body = document.body;
        const isDark = body.getAttribute('data-theme') === 'dark';
        if (isDark) {
            body.setAttribute('data-theme', 'light');
            document.getElementById('themeIcon').textContent = '🌙';
        } else {
            body.setAttribute('data-theme', 'dark');
            document.getElementById('themeIcon').textContent = '☀️';
        }
    });

    // ================================================================
    // EVENT LISTENERS
    // ================================================================

    // Temperature slider
    document.getElementById('tempSlider').addEventListener('input', function() {
        updateTemperature(parseFloat(this.value));
    });

    // Heatmap selector
    document.getElementById('heatmapSelect').addEventListener('change', function() {
        heatmapMode = this.value;
        applyHeatmap();
    });

    // Category filter buttons (dynamically added)
    function createFilterButtons() {
        const headerControls = document.querySelector('.header-controls');
        const filterGroup = document.createElement('div');
        filterGroup.className = 'filter-group';

        const categories = ['all', ...Object.keys(CATEGORY_NAMES)];
        const labels = {
            'all': '🔬 All',
            'alkali': '🧪 Alkali',
            'alkaline': '🧪 Alkaline',
            'transition': '⚙️ Transition',
            'post-transition': '⚙️ Post-Transition',
            'metalloid': '💎 Metalloid',
            'nonmetal': '🌿 Nonmetal',
            'halogen': '🧪 Halogen',
            'noble': '🎈 Noble Gas',
            'lanthanide': '🔮 Lanthanide',
            'actinide': '☢️ Actinide',
            'unknown': '❓ Unknown'
        };

        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = `filter-btn ${cat === 'all' ? 'active' : ''}`;
            btn.dataset.filter = cat;
            btn.textContent = labels[cat] || cat;
            btn.addEventListener('click', function() {
                currentFilter = this.dataset.filter;
                applyFilter();
            });
            filterGroup.appendChild(btn);
        });

        // Insert after temperature control
        const tempControl = document.querySelector('.temp-control');
        headerControls.insertBefore(filterGroup, tempControl.nextSibling);
    }

    // ================================================================
    // INIT
    // ================================================================
    window.onload = function() {
        createFilterButtons();
        buildPeriodicTable();
        updateTemperature(298);

        // Select Hydrogen by default
        setTimeout(() => {
            selectElement(1);
        }, 300);
    };

    console.log('⚛️ Advanced Periodic Table loaded!');
    console.log(`📊 ${ELEMENTS.length} elements loaded`);
    console.log('🔬 Click any element to explore its properties');
</script>
